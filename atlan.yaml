name: testing-something
display_name: "Mongodb"
type: connector
execution_mode: argo
icon_url: ""
visibility: public
argo_package_names:
  - "@atlan/mongo"

build_tag: v1
# If set to true, images will be pushed to a shared repository where customers can also pull
self_deployed_runtime: true

deploy:
  replicaCount: 1
  env:
    ATLAN_HEARTBEAT_TIMEOUT_SECONDS: "1800"
    ATLAN_START_TO_CLOSE_TIMEOUT_SECONDS: "7200"
    ATLAN_TENANT_ID: "default"
  containerPort: 8000
  dapr:
    objectstore: true
    statestore: false
    eventstore: false
    subscription: false
    secretstore: true
    configurationstore: false
    lock: false
